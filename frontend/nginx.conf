server {
  listen 80;
  server_name _;
  # 11 MB permits multipart overhead while Laravel enforces a 10 MB file limit.
  client_max_body_size 11m;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $upstream_api http://api:8000;
    proxy_pass $upstream_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Laravel may wait for the AI service. The app returns a safe 429/503 before this limit when Gemini is unavailable.
    proxy_connect_timeout 5s;
    proxy_send_timeout 620s;
    proxy_read_timeout 620s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
